<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a2c"/>
      <stop offset="100%" stop-color="#1d1d1f"/>
    </linearGradient>
    <linearGradient id="card1" x1="96" y1="128" x2="416" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>

  <!-- App icon background: 铺满画布，圆角由 macOS 系统自动裁切 -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Bottom project card -->
  <rect x="96" y="272" width="320" height="88" rx="20" fill="#252526" stroke="#38383a" stroke-width="2"/>

  <!-- Middle project card -->
  <rect x="96" y="200" width="320" height="88" rx="20" fill="#2c2c2e" stroke="#38383a" stroke-width="2"/>

  <!-- Top project card (active) -->
  <rect x="96" y="128" width="320" height="88" rx="20" fill="url(#card1)" stroke="#48484a" stroke-width="2"/>

  <!-- Terminal prompt chevron -->
  <path d="M128 162 L148 172 L128 182" stroke="#ff6b35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Code lines on top card -->
  <rect x="168" y="158" width="120" height="8" rx="4" fill="#8e8e93" opacity="0.6"/>
  <rect x="168" y="178" width="80" height="8" rx="4" fill="#aeaeb2" opacity="0.45"/>

  <!-- Play / launch button -->
  <circle cx="368" cy="172" r="28" fill="#ff6b35"/>
  <path d="M360 158 L360 186 L382 172 Z" fill="#ffffff"/>

  <!-- Running status dot -->
  <circle cx="392" cy="144" r="14" fill="#30d158"/>
  <circle cx="392" cy="144" r="14" fill="#30d158" opacity="0.35"/>
</svg>
